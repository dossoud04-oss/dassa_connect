name: Build Dassa Connect

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter clean
      - run: flutter pub get

      # Compilation d'un seul APK ultra-compatible (ARM 32 et 64 bits)
      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-tree-shake-icons

      # Sauvegarde de l'APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
